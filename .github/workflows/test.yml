name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-frontend.txt
      - run: python -m pip install -r requirements-frontend.txt
      - name: FFmpeg für Schnitt- und Episodentests installieren (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: FFmpeg für Schnitt- und Episodentests installieren (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
  frozen-engine:
    name: Windows-EXE 3.12 / Engine 3.11
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: frontend
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Tatsächliche Windows-EXE mit Vorschau-Worker bauen
        run: |
          $workerPath = (Resolve-Path preview_worker.py).Path
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name RuntimeCheck --distpath frozen-dist --workpath frozen-build --specpath frozen-build --hidden-import unicodedata --add-data "$workerPath;." app.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Separates Python ohne Videoberechnung aus der EXE starten
        run: python tools/test_frozen_engine.py --app frozen-dist/RuntimeCheck.exe --work frozen-test
